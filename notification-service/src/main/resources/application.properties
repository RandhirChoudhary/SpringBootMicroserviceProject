spring.application.name=notification-service
eureka.client.service-url.defaultZone=http://eureka:password@localhost:8761/eureka
server.port=0
management.tracing.sampling.probability= 1.0
management.tracing.export.zipkin.endpoint= http://localhost:9411/api/v2/spans

##kafka properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.rktech.OrderPlacedEvent
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest

##Actuator endpoints
##Prometheus is used to collect metrics data for monitoring purpose
management.endpoints.web.exposure.include=health,info,metrics,prometheus