eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
server.port=8761

eureka.username=${EUREKA_USERNAME:eureka}
eureka.password=${EUREKA_PASSWORD:password}

##Micrometer and zipkin properties for tracing
management.tracing.sampling.probability= 1.0
##Actuator endpoints
##Prometheus is used to collect metrics data for monitoring purpose
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.export.zipkin.endpoint= http://localhost:9411/api/v2/spans

